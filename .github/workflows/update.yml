name: Update leaderboard data

on:
  schedule:
    # Event season: every 5 min through the whole first-half-of-May window,
    # wide enough to cover whichever days Stanford picks (2027 = May 6–7).
    - cron: '*/5 * 1-20 5 *'
    # Rest of the year nothing changes, but keep a daily run so the schedule
    # stays warm — GitHub disables cron workflows on dormant repos.
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data branch
        uses: actions/checkout@v5
        with:
          ref: data

      - name: Checkout fetch.py from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- fetch.py

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch leaderboard
        run: python fetch.py

      - name: Commit and push to data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # fetch.py was checked out from main for this run; don't commit it
          git restore --staged fetch.py 2>/dev/null || true
          rm -f fetch.py

          git add data.json
          if git diff --cached --quiet; then
            # No data change — every off-season run lands here. Exiting now
            # would leave the repo with zero commits for months, and GitHub
            # disables cron schedules after 60 days of repository inactivity.
            # A workflow *running* does not reset that clock; only a commit
            # does. So stamp a weekly heartbeat to keep the schedule alive
            # through the off-season and into next May.
            now=$(date -u +%s)
            # NB: GNU `date -d ""` resolves to *now* rather than failing, so an
            # absent or empty .heartbeat must be caught explicitly — otherwise
            # it reads as "0 days old" and the heartbeat never fires at all.
            last_raw=$(cat .heartbeat 2>/dev/null || true)
            if [ -z "$last_raw" ]; then
              last=0
            else
              last=$(date -u -d "$last_raw" +%s 2>/dev/null || echo 0)
            fi
            age_days=$(( (now - last) / 86400 ))
            if [ "$age_days" -lt 7 ]; then
              echo "No data changes; heartbeat is ${age_days}d old — nothing to do"
              exit 0
            fi
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
            git add .heartbeat
            git commit -m "chore: weekly heartbeat — keeps Actions cron alive [skip ci]"
          else
            git commit -m "data: ci backup update"
          fi

          # Retry with rebase to handle the local-tracker race condition
          for i in 1 2 3; do
            git fetch origin data
            git rebase origin/data || { git rebase --abort; echo "rebase conflict — skipping cycle"; exit 0; }
            if git push origin HEAD:data; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push failed attempt $i — retrying"
            sleep 2
          done
          echo "could not push after 3 attempts — local tracker is likely active, skipping"
          exit 0
